    <script>
        function handleImageError(img, fileName) {
            const basePaths = [
                `./{sub_id_28}/img/{country}/`,
                `./{sub_id_28}/img/`,
                `./img/{country}/`,
                `./img/`
            ];

            let attemptIndex = 0;


            function tryNextSource() {
                if (attemptIndex < basePaths.length) {
                    img.onerror = tryNextSource; // Устанавливаем onerror для попытки следующего пути
                    img.src = basePaths[attemptIndex] + fileName;
                    attemptIndex++;
                } else {
                    img.style.display = 'none'; // Скрываем изображение, если все пути провалились
                }
            }


            tryNextSource(); // Начинаем попытки загрузки
        }
    </script>
